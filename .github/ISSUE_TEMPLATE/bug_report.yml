name: Bug report / 问题报告
description: Report an installation, offline-test, or publisher defect with sanitized examples.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use fictional account/content identifiers and the smallest relevant error excerpt.
        请使用虚构账号/内容标识，只提供最小必要错误片段。
        Do not paste cookies, tokens, API keys, browser profiles, real account configurations, full receipts, business media, student/customer data, or private paths.
        不要贴 Cookie、令牌、密钥、浏览器登录态、真实账号配置、完整回执、业务素材、学生/客户资料或私人路径。
        Keep existing job locks and receipts. An uncertain result must be reconciled before another submission.
        保留原任务锁和回执；结果不明时先对账，不通过删锁或换后端重发。
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: "v0.1.0 or public commit SHA"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method / 安装方式
      options:
        - Release tgz (global npm)
        - GitHub npm package (global npm)
        - Git checkout + npm link
        - Local npm prefix
        - Other / 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, Node.js, npm, and (if relevant) Ego/browser-guide versions only.
      placeholder: "macOS; Node 24.x; npm 11.x; Ego 0.6.0.16; guide 2.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现
      description: Use mock data or fictional account keys. Do not repeat an uncertain real write to reproduce it.
      placeholder: |
        1. Run an offline fixture or a sanitized command.
        2. Use account key fictional_owner and placeholder content.
        3. State which step fails. Do not attach the real account matrix.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result / 预期与实际结果
      description: Include only a sanitized error code or a short excerpt, not complete logs/receipts.
      placeholder: "Expected: mock workflow completes. Actual: ERROR_CODE at the check step."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I removed credentials, real account/content identifiers, private paths, and business data. / 已移除凭据、真实账号/作品标识、私人路径及业务资料。
          required: true
